<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: main(content=~{::content}, customCss=~{}, customJs=~{::customJs})}">
<body>
    <th:block th:fragment="content">
        <!-- Page Header -->
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col">
                    <h1><i class="bi bi-building"></i> Warehouse Management</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Warehouses</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-auto">
                    <a th:href="@{/warehouses/new}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Add New Warehouse
                    </a>
                </div>
            </div>
        </div>

        <!-- Warehouses Table -->
        <div class="card">
            <div class="card-header">
                <div class="row align-items-center">
                    <div class="col">
                        <h5 class="mb-0">All Warehouses (<span th:text="${totalItems}">0</span>)</h5>
                    </div>
                    <div class="col-auto">
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchInput" placeholder="Search warehouses...">
                            <button class="btn btn-outline-secondary" type="button">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" id="warehousesTable">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Location</th>
                                <th>City</th>
                                <th>Contact Person</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${warehouses.isEmpty()}">
                                <td colspan="9" class="text-center py-5">
                                    <i class="bi bi-inbox" style="font-size: 3rem; color: #ccc;"></i>
                                    <p class="text-muted mt-3">No warehouses found</p>
                                </td>
                            </tr>
                            <tr th:each="warehouse : ${warehouses}">
                                <td th:text="${warehouse.id}">#</td>
                                <td>
                                    <span class="badge bg-dark" th:text="${warehouse.code}">CODE</span>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <i class="bi bi-building text-primary me-2" style="font-size: 1.5rem;"></i>
                                        <strong th:text="${warehouse.name}">Name</strong>
                                    </div>
                                </td>
                                <td th:text="${warehouse.location}">Location</td>
                                <td th:text="${warehouse.city ?: '-'}">City</td>
                                <td th:text="${warehouse.contactPerson ?: '-'}">Contact</td>
                                <td th:text="${warehouse.phone ?: '-'}">Phone</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${warehouse.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${warehouse.status.name()}">
                                        Status
                                    </span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group btn-group-sm" role="group">
                                        <a th:href="@{/warehouses/{id}(id=${warehouse.id})}"
                                           class="btn btn-outline-info"
                                           data-bs-toggle="tooltip"
                                           title="View">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/warehouses/{id}/edit(id=${warehouse.id})}"
                                           class="btn btn-outline-primary"
                                           data-bs-toggle="tooltip"
                                           title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <button type="button"
                                                class="btn btn-outline-danger"
                                                data-bs-toggle="tooltip"
                                                title="Delete"
                                                th:onclick="'deleteWarehouse(' + ${warehouse.id} + ')'">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer" th:if="${totalPages > 1}">
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/warehouses(page=${currentPage - 1}, size=${10})}">
                                <i class="bi bi-chevron-left"></i> Previous
                            </a>
                        </li>
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/warehouses(page=${i}, size=${10})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/warehouses(page=${currentPage + 1}, size=${10})}">
                                Next <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <!-- Delete Confirmation Form -->
        <form id="deleteForm" method="post" style="display: none;">
            <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
        </form>
    </th:block>

    <th:block th:fragment="customJs">
        <script>
            // Table search functionality
            tableSearch('searchInput', 'warehousesTable');

            // Delete warehouse function
            function deleteWarehouse(warehouseId) {
                if (confirmDelete('Are you sure you want to delete this warehouse? This will also remove all associated data and user access.')) {
                    const form = document.getElementById('deleteForm');
                    form.action = '/warehouses/' + warehouseId + '/delete';
                    form.submit();
                }
            }
        </script>
    </th:block>
</body>
</html>
