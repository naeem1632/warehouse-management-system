<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: main(content=~{::content}, customCss=~{}, customJs=~{::customJs})}">
<body>
    <th:block th:fragment="content">
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col">
                    <h1><i class="bi bi-people"></i> Customer Management</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item active">Customers</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-auto">
                    <a th:href="@{/customers/create}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> New Customer
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">All Customers (<span th:text="${#lists.size(customers)}">0</span>)</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Contact Person</th>
                                <th>Phone</th>
                                <th>City</th>
                                <th>Current Balance</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(customers)}">
                                <td colspan="8" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                                    <p class="mb-0 mt-2">No customers found</p>
                                </td>
                            </tr>
                            <tr th:each="customer : ${customers}">
                                <td><strong th:text="${customer.code}"></strong></td>
                                <td th:text="${customer.name}"></td>
                                <td th:text="${customer.contactPerson} ?: 'N/A'"></td>
                                <td th:text="${customer.phone} ?: 'N/A'"></td>
                                <td th:text="${customer.city} ?: 'N/A'"></td>
                                <td>
                                    <span th:if="${customer.currentBalance != null}">
                                        <span th:text="${#numbers.formatDecimal(customer.currentBalance, 1, 2)}"></span>
                                        <small th:text="${customer.currentBalanceType}" class="text-muted"></small>
                                    </span>
                                    <span th:if="${customer.currentBalance == null}">0.00</span>
                                </td>
                                <td>
                                    <span th:if="${customer.status == 'ACTIVE'}" class="badge bg-success">Active</span>
                                    <span th:if="${customer.status == 'INACTIVE'}" class="badge bg-secondary">Inactive</span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/customers/{id}(id=${customer.id})}" class="btn btn-outline-info" title="View">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/customers/{id}/ledger(id=${customer.id})}" class="btn btn-outline-primary" title="Ledger">
                                            <i class="bi bi-journal-text"></i>
                                        </a>
                                        <a th:href="@{/customers/{id}/edit(id=${customer.id})}" class="btn btn-outline-warning" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/customers/{id}/delete(id=${customer.id})}" method="post" style="display:inline;">
                                            <button type="submit" class="btn btn-outline-danger btn-sm" title="Delete"
                                                    onclick="return confirm('Are you sure you want to delete this customer?')">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </th:block>
    <th:block th:fragment="customJs"></th:block>
</body>
</html>
