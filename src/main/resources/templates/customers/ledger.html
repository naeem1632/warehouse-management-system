<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: main(content=~{::content}, customCss=~{}, customJs=~{})}">
<body><th:block th:fragment="content">
<div class="page-header"><h1><i class="bi bi-journal-text"></i> Customer Ledger - <span th:text="${customer.name}"></span></h1>
<nav><ol class="breadcrumb"><li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
<li class="breadcrumb-item"><a th:href="@{/customers}">Customers</a></li><li class="breadcrumb-item active">Ledger</li></ol></nav></div>
<div class="card mb-3"><div class="card-body"><form th:action="@{/customers/{id}/ledger(id=${customer.id})}" method="get" class="row g-3">
<div class="col-md-5"><label class="form-label">Start Date</label><input type="date" name="startDate" class="form-control" th:value="${startDate}"></div>
<div class="col-md-5"><label class="form-label">End Date</label><input type="date" name="endDate" class="form-control" th:value="${endDate}"></div>
<div class="col-md-2"><label class="form-label">&nbsp;</label><button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel"></i> Filter</button></div>
</form></div></div>
<div class="card"><div class="card-header"><h5>Ledger Entries</h5></div><div class="card-body p-0"><div class="table-responsive">
<table class="table table-hover mb-0"><thead class="table-light"><tr><th>Date</th><th>Description</th><th class="text-end">Debit</th>
<th class="text-end">Credit</th><th class="text-end">Balance</th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(ledgerEntries)}"><td colspan="5" class="text-center py-4">No ledger entries found</td></tr>
<tr th:each="entry : ${ledgerEntries}"><td th:text="${#temporals.format(entry.transactionDate, 'dd-MMM-yyyy')}"></td>
<td th:text="${entry.description}"></td><td class="text-end" th:text="${#numbers.formatDecimal(entry.debit, 1, 2)}"></td>
<td class="text-end" th:text="${#numbers.formatDecimal(entry.credit, 1, 2)}"></td>
<td class="text-end"><strong th:text="${#numbers.formatDecimal(entry.balance, 1, 2)}"></strong> <small th:text="${entry.balanceType}" class="text-muted"></small></td></tr>
</tbody></table></div></div></div>
</th:block></body></html>
