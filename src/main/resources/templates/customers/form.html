<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: main(content=~{::content}, customCss=~{}, customJs=~{::customJs})}">
<body>
    <th:block th:fragment="content">
        <div class="page-header">
            <h1><i class="bi bi-people"></i> <span th:text="${customer.id != null ? 'Edit Customer' : 'New Customer'}"></span></h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/customers}">Customers</a></li>
                    <li class="breadcrumb-item active" th:text="${customer.id != null ? 'Edit' : 'New'}"></li>
                </ol>
            </nav>
        </div>

        <form th:action="${customer.id != null ? '/customers/' + customer.id : '/customers'}" method="post" th:object="${customer}">
            <div class="card mb-3">
                <div class="card-header"><h5>Basic Information</h5></div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Business Type</label>
                            <select class="form-select" th:field="*{businessType}">
                                <option value="">Select Type</option>
                                <option value="Retailer">Retailer</option>
                                <option value="Wholesaler">Wholesaler</option>
                                <option value="Distributor">Distributor</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Contact Person</label>
                            <input type="text" class="form-control" th:field="*{contactPerson}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Designation</label>
                            <input type="text" class="form-control" th:field="*{designation}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{phone}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Alternate Phone</label>
                            <input type="text" class="form-control" th:field="*{alternatePhone}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control" th:field="*{city}">
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control" th:field="*{address}" rows="2"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header"><h5>Business Details</h5></div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">NTN</label>
                            <input type="text" class="form-control" th:field="*{ntn}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">STRN</label>
                            <input type="text" class="form-control" th:field="*{strn}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Payment Terms</label>
                            <input type="text" class="form-control" th:field="*{paymentTerms}" placeholder="e.g., Net 30 days">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Credit Limit</label>
                            <input type="number" class="form-control" th:field="*{creditLimit}" step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="ACTIVE">Active</option>
                                <option value="INACTIVE">Inactive</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-3" th:if="${customer.id == null}">
                <div class="card-header"><h5>Opening Balance</h5></div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Opening Balance</label>
                            <input type="number" class="form-control" th:field="*{openingBalance}" step="0.01" value="0">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Balance Type</label>
                            <select class="form-select" th:field="*{openingBalanceType}">
                                <option value="">Select Type</option>
                                <option value="DEBIT">Debit (Customer owes)</option>
                                <option value="CREDIT">Credit (Advance payment)</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Opening Date</label>
                            <input type="date" class="form-control" th:field="*{openingDate}">
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between mb-4">
                <a th:href="@{/customers}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save Customer</button>
            </div>
        </form>
    </th:block>
    <th:block th:fragment="customJs"></th:block>
</body>
</html>
