<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: main(content=~{::content}, customCss=~{}, customJs=~{::customJs})}">
<body>
    <th:block th:fragment="content">
        <!-- Page Header -->
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col">
                    <h1><i class="bi bi-box-seam"></i> Products</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Products</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-auto">
                    <a th:href="@{/products/new}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Add New Product
                    </a>
                </div>
            </div>
        </div>

        <!-- Products Table -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">All Products</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>SKU</th>
                                <th>Name</th>
                                <th>Warehouse</th>
                                <th>Unit</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${products.isEmpty()}">
                                <td colspan="6" class="text-center py-5">
                                    <i class="bi bi-inbox" style="font-size: 3rem; color: #ccc;"></i>
                                    <p class="text-muted mt-3">No products found</p>
                                </td>
                            </tr>
                            <tr th:each="product : ${products}">
                                <td><code th:text="${product.sku}">SKU</code></td>
                                <td><strong th:text="${product.name}">Product Name</strong></td>
                                <td>
                                    <span class="badge bg-info" th:text="${product.warehouseName}">Warehouse</span>
                                </td>
                                <td th:text="${product.unit}">Unit</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${product.status?.name() == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${product.status}">
                                        Status
                                    </span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/products/edit/{id}(id=${product.id})}"
                                           class="btn btn-outline-primary"
                                           data-bs-toggle="tooltip"
                                           title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <button type="button"
                                                class="btn btn-outline-danger btn-delete-product"
                                                data-bs-toggle="tooltip"
                                                title="Delete"
                                                th:data-product-id="${product.id}"
                                                th:data-product-name="${product.name}">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Form -->
        <form id="deleteForm" method="post" style="display: none;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        </form>
    </th:block>

    <th:block th:fragment="customJs">
        <script>
            // Delete product event listeners
            document.addEventListener('DOMContentLoaded', function() {
                const deleteButtons = document.querySelectorAll('.btn-delete-product');
                deleteButtons.forEach(function(button) {
                    button.addEventListener('click', function() {
                        const productId = this.getAttribute('data-product-id');
                        const productName = this.getAttribute('data-product-name');

                        if (confirmDelete('Are you sure you want to delete product "' + productName + '"? This action cannot be undone.')) {
                            const form = document.getElementById('deleteForm');
                            form.action = '/products/delete/' + productId;
                            form.submit();
                        }
                    });
                });
            });
        </script>
    </th:block>
</body>
</html>
