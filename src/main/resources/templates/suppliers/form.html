<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: main(content=~{::content}, customCss=~{}, customJs=~{::customJs})}">
<body>
    <th:block th:fragment="content">
        <!-- Page Header -->
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col">
                    <h1>
                        <i class="bi bi-truck"></i>
                        <span th:text="${supplier.id != null} ? 'Edit Supplier' : 'Add New Supplier'"></span>
                    </h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/suppliers}">Suppliers</a></li>
                            <li class="breadcrumb-item active" th:text="${supplier.id != null} ? 'Edit' : 'Add'"></li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>

        <!-- Alert Messages -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Supplier Form -->
        <form th:action="${supplier.id != null} ? @{/suppliers/{id}(id=${supplier.id})} : @{/suppliers}"
              method="post" th:object="${supplier}">
            <div class="row">
                <div class="col-lg-8">
                    <!-- Basic Information -->
                    <div class="card mb-3">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-info-circle"></i> Basic Information</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Supplier Code *</label>
                                    <input type="text" class="form-control" th:field="*{code}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Supplier Name *</label>
                                    <input type="text" class="form-control" th:field="*{name}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Business Type</label>
                                    <select class="form-select" th:field="*{businessType}">
                                        <option value="">Select Type</option>
                                        <option th:each="type : ${businessTypes}" th:value="${type}" th:text="${type.displayName}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Status *</label>
                                    <select class="form-select" th:field="*{status}" required>
                                        <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Contact Information -->
                    <div class="card mb-3">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-person"></i> Contact Information</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Contact Person</label>
                                    <input type="text" class="form-control" th:field="*{contactPerson}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Designation</label>
                                    <input type="text" class="form-control" th:field="*{designation}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Phone</label>
                                    <input type="text" class="form-control" th:field="*{phone}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Alternate Phone</label>
                                    <input type="text" class="form-control" th:field="*{alternatePhone}">
                                </div>
                                <div class="col-md-12 mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" th:field="*{email}">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Address Information -->
                    <div class="card mb-3">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-geo-alt"></i> Address Information</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label class="form-label">Address</label>
                                    <textarea class="form-control" th:field="*{address}" rows="3"></textarea>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">City</label>
                                    <input type="text" class="form-control" th:field="*{city}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <!-- Tax Information -->
                    <div class="card mb-3">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-receipt"></i> Tax Information</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">NTN</label>
                                <input type="text" class="form-control" th:field="*{ntn}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">STRN</label>
                                <input type="text" class="form-control" th:field="*{strn}">
                            </div>
                        </div>
                    </div>

                    <!-- Financial Information -->
                    <div class="card mb-3">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-cash"></i> Financial Information</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Payment Terms</label>
                                <input type="text" class="form-control" th:field="*{paymentTerms}" placeholder="e.g., Net 30 days">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Credit Limit</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{creditLimit}">
                            </div>
                        </div>
                    </div>

                    <!-- Opening Balance (Only for New Supplier) -->
                    <div class="card mb-3" th:if="${supplier.id == null}">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-calculator"></i> Opening Balance</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Balance Amount</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{openingBalance}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Balance Type</label>
                                <select class="form-select" th:field="*{openingBalanceType}">
                                    <option value="">Select Type</option>
                                    <option th:each="type : ${balanceTypes}" th:value="${type}" th:text="${type.displayName}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Opening Date</label>
                                <input type="date" class="form-control" th:field="*{openingDate}">
                            </div>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="card">
                        <div class="card-body">
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Save Supplier
                                </button>
                                <a th:href="@{/suppliers}" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-circle"></i> Cancel
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </th:block>

    <th:block th:fragment="customJs">
        <script>
        </script>
    </th:block>
</body>
</html>
