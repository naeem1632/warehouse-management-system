<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: main(content=~{::content}, customCss=~{}, customJs=~{})}">
<body><th:block th:fragment="content">
<div class="page-header"><div class="row"><div class="col"><h1><i class="bi bi-clipboard-check"></i> Stock Adjustments</h1></div>
<div class="col-auto"><a th:href="@{/stock/adjustments/pending}" class="btn btn-warning me-2"><i class="bi bi-clock"></i> Pending (<span th:text="${pendingCount}">0</span>)</a>
<a th:href="@{/stock/adjustments/create}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> New Adjustment</a></div></div></div>
<div class="card mb-3"><div class="card-body"><form th:action="@{/stock/adjustments}" method="get" class="row g-3">
<div class="col-md-3"><label>Warehouse</label><select name="warehouseId" class="form-select"><option value="">All Warehouses</option>
<option th:each="warehouse : ${warehouses}" th:value="${warehouse.id}" th:text="${warehouse.name}" th:selected="${warehouseId == warehouse.id}"></option></select></div>
<div class="col-md-2"><label>Product</label><select name="productId" class="form-select"><option value="">All Products</option>
<option th:each="product : ${products}" th:value="${product.id}" th:text="${product.name}" th:selected="${productId == product.id}"></option></select></div>
<div class="col-md-2"><label>Status</label><select name="status" class="form-select"><option value="">All Status</option>
<option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${status == s}"></option></select></div>
<div class="col-md-2"><label>Start Date</label><input type="date" name="startDate" class="form-control" th:value="${startDate}"></div>
<div class="col-md-2"><label>End Date</label><input type="date" name="endDate" class="form-control" th:value="${endDate}"></div>
<div class="col-md-1"><label>&nbsp;</label><button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel"></i></button></div></form></div></div>
<div class="card"><div class="card-header"><h5>Adjustment History (<span th:text="${totalItems}">0</span>)</h5></div><div class="card-body p-0"><div class="table-responsive">
<table class="table table-hover mb-0"><thead class="table-light"><tr><th>Adjustment #</th><th>Date</th><th>Warehouse</th><th>Product</th>
<th>Type</th><th>Qty Before</th><th>Adjustment</th><th>Qty After</th><th>Status</th><th>Actions</th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(adjustments)}"><td colspan="10" class="text-center py-4">No adjustments found</td></tr>
<tr th:each="adj : ${adjustments}"><td><strong th:text="${adj.adjustmentNumber}"></strong></td>
<td th:text="${#temporals.format(adj.adjustmentDate, 'dd-MMM-yyyy')}"></td>
<td><small th:text="${adj.warehouseName}"></small></td>
<td><div th:text="${adj.productName}"></div><small class="text-muted" th:text="${adj.productSku}"></small></td>
<td><span class="badge bg-secondary" th:text="${adj.adjustmentType}"></span></td>
<td class="text-end" th:text="${#numbers.formatDecimal(adj.quantityBefore, 1, 2)}"></td>
<td class="text-end" th:classappend="${adj.adjustmentQuantity.compareTo(T(java.math.BigDecimal).ZERO) >= 0} ? 'text-success' : 'text-danger'">
<strong th:text="${adj.adjustmentQuantity.compareTo(T(java.math.BigDecimal).ZERO) >= 0 ? '+' : ''} + ${#numbers.formatDecimal(adj.adjustmentQuantity, 1, 2)}"></strong></td>
<td class="text-end" th:text="${#numbers.formatDecimal(adj.quantityAfter, 1, 2)}"></td>
<td><span th:if="${adj.status?.name() == 'PENDING'}" class="badge bg-warning">Pending</span>
<span th:if="${adj.status?.name() == 'APPROVED'}" class="badge bg-success">Approved</span>
<span th:if="${adj.status?.name() == 'REJECTED'}" class="badge bg-danger">Rejected</span></td>
<td><a th:href="@{/stock/adjustments/{id}(id=${adj.id})}" class="btn btn-outline-info btn-sm" title="View"><i class="bi bi-eye"></i></a></td></tr>
</tbody></table></div></div>
<div class="card-footer" th:if="${totalPages > 1}"><nav><ul class="pagination justify-content-center mb-0">
<li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link" th:href="@{/stock/adjustments(page=${currentPage - 1})}">Previous</a></li>
<li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
<a class="page-link" th:href="@{/stock/adjustments(page=${i})}" th:text="${i + 1}"></a></li>
<li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'"><a class="page-link" th:href="@{/stock/adjustments(page=${currentPage + 1})}">Next</a></li>
</ul></nav></div></div>
</th:block></body></html>
