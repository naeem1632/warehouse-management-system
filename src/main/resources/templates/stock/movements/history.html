<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: main(content=~{::content}, customCss=~{}, customJs=~{})}">
<body><th:block th:fragment="content">
<div class="page-header"><div class="row"><div class="col"><h1><i class="bi bi-clock-history"></i> Stock Movement History</h1></div>
<div class="col-auto"><a th:href="@{/stock/overview}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Stock Overview</a></div></div></div>
<div class="card mb-3"><div class="card-body"><form th:action="@{/stock/movements}" method="get" class="row g-3">
<div class="col-md-3"><label>Warehouse</label><select name="warehouseId" class="form-select"><option value="">All Warehouses</option>
<option th:each="warehouse : ${warehouses}" th:value="${warehouse.id}" th:text="${warehouse.name}" th:selected="${warehouseId == warehouse.id}"></option></select></div>
<div class="col-md-2"><label>Product</label><select name="productId" class="form-select"><option value="">All Products</option>
<option th:each="product : ${products}" th:value="${product.id}" th:text="${product.name}" th:selected="${productId == product.id}"></option></select></div>
<div class="col-md-2"><label>Movement Type</label><select name="movementType" class="form-select"><option value="">All Types</option>
<option th:each="type : ${movementTypes}" th:value="${type}" th:text="${type}" th:selected="${movementType == type}"></option></select></div>
<div class="col-md-2"><label>Start Date</label><input type="date" name="startDate" class="form-control" th:value="${startDate}"></div>
<div class="col-md-2"><label>End Date</label><input type="date" name="endDate" class="form-control" th:value="${endDate}"></div>
<div class="col-md-1"><label>&nbsp;</label><button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel"></i></button></div></form></div></div>
<div class="card"><div class="card-header"><h5>Movement History (<span th:text="${totalItems}">0</span> records)</h5></div><div class="card-body p-0"><div class="table-responsive">
<table class="table table-hover table-sm mb-0"><thead class="table-light"><tr><th>Date</th><th>Warehouse</th><th>Product</th>
<th>Type</th><th class="text-end">Quantity</th><th class="text-end">Rate</th><th class="text-end">Qty Before</th><th class="text-end">Qty After</th><th>Reference</th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(movements)}"><td colspan="9" class="text-center py-4">No movements found</td></tr>
<tr th:each="mov : ${movements}"><td th:text="${#temporals.format(mov.createdAt, 'dd-MMM-yyyy HH:mm')}"></td>
<td><small th:text="${mov.warehouseName}"></small></td>
<td><div th:text="${mov.productName}"></div><small class="text-muted" th:text="${mov.productSku}"></small></td>
<td><span class="badge" th:classappend="${mov.movementType?.name() == 'PURCHASE'} ? 'bg-success' :
    (${mov.movementType?.name() == 'SALE'} ? 'bg-primary' :
    (${mov.movementType?.name() == 'ADJUSTMENT'} ? 'bg-warning' : 'bg-secondary'))"
    th:text="${mov.movementType}"></span></td>
<td class="text-end" th:classappend="${mov.quantity.compareTo(T(java.math.BigDecimal).ZERO) >= 0} ? 'text-success' : 'text-danger'">
<strong th:text="${mov.quantity.compareTo(T(java.math.BigDecimal).ZERO) >= 0 ? '+' : ''} + ${#numbers.formatDecimal(mov.quantity, 1, 3)}"></strong></td>
<td class="text-end"><small th:text="${#numbers.formatDecimal(mov.rate, 1, 2)}"></small></td>
<td class="text-end"><small th:text="${#numbers.formatDecimal(mov.quantityBefore, 1, 3)}"></small></td>
<td class="text-end"><strong th:text="${#numbers.formatDecimal(mov.quantityAfter, 1, 3)}"></strong></td>
<td><small th:text="${mov.notes}"></small></td></tr>
</tbody></table></div></div>
<div class="card-footer" th:if="${totalPages > 1}"><nav><ul class="pagination justify-content-center mb-0">
<li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link" th:href="@{/stock/movements(page=${currentPage - 1})}">Previous</a></li>
<li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
<a class="page-link" th:href="@{/stock/movements(page=${i})}" th:text="${i + 1}"></a></li>
<li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'"><a class="page-link" th:href="@{/stock/movements(page=${currentPage + 1})}">Next</a></li>
</ul></nav></div></div>
</th:block></body></html>
