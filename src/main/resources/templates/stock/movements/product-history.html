<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: main(content=~{::content}, customCss=~{}, customJs=~{})}">
<body><th:block th:fragment="content">
<div class="page-header"><div class="row"><div class="col"><h1><i class="bi bi-clock-history"></i> Product Movement History</h1></div>
<div class="col-auto"><a th:href="@{/stock/overview}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a></div></div></div>
<div class="card mb-3"><div class="card-body"><div class="row">
<div class="col-md-6"><h6 class="text-muted">Warehouse</h6><p class="fw-bold" th:text="${warehouse.name}"></p></div>
<div class="col-md-6"><h6 class="text-muted">Product</h6><p class="fw-bold"><span th:text="${product.name}"></span> (<span th:text="${product.sku}"></span>)</p></div>
</div>
<form th:action="@{/stock/movements/{wid}/{pid}(wid=${warehouse.id},pid=${product.id})}" method="get" class="row g-3 mt-2">
<div class="col-md-4"><label>Start Date</label><input type="date" name="startDate" class="form-control" th:value="${startDate}"></div>
<div class="col-md-4"><label>End Date</label><input type="date" name="endDate" class="form-control" th:value="${endDate}"></div>
<div class="col-md-4"><label>&nbsp;</label><button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel"></i> Filter</button></div>
</form></div></div>
<div class="card"><div class="card-header"><h5>Movement History (<span th:text="${#lists.size(movements)}">0</span> records)</h5></div><div class="card-body p-0"><div class="table-responsive">
<table class="table table-hover mb-0"><thead class="table-light"><tr><th>Date & Time</th><th>Type</th>
<th class="text-end">Quantity</th><th class="text-end">Rate</th><th class="text-end">Qty Before</th><th class="text-end">Qty After</th><th>Reference/Notes</th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(movements)}"><td colspan="7" class="text-center py-4">No movement history found for this product</td></tr>
<tr th:each="mov : ${movements}"><td th:text="${#temporals.format(mov.createdAt, 'dd-MMM-yyyy HH:mm')}"></td>
<td><span class="badge" th:classappend="${mov.movementType?.name() == 'PURCHASE'} ? 'bg-success' :
    (${mov.movementType?.name() == 'SALE'} ? 'bg-primary' :
    (${mov.movementType?.name() == 'OPENING'} ? 'bg-info' :
    (${mov.movementType?.name() == 'ADJUSTMENT'} ? 'bg-warning' : 'bg-secondary')))"
    th:text="${mov.movementType}"></span></td>
<td class="text-end" th:classappend="${mov.quantity.compareTo(T(java.math.BigDecimal).ZERO) >= 0} ? 'text-success' : 'text-danger'">
<strong th:text="${mov.quantity.compareTo(T(java.math.BigDecimal).ZERO) >= 0 ? '+' : ''} + ${#numbers.formatDecimal(mov.quantity, 1, 3)}"></strong></td>
<td class="text-end" th:text="${#numbers.formatDecimal(mov.rate, 1, 2)}"></td>
<td class="text-end"><small th:text="${#numbers.formatDecimal(mov.quantityBefore, 1, 3)}"></small></td>
<td class="text-end"><strong th:text="${#numbers.formatDecimal(mov.quantityAfter, 1, 3)}"></strong></td>
<td><small th:text="${mov.notes}"></small></td></tr>
</tbody></table></div></div></div>
</th:block></body></html>
