<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: main(content=~{::content}, customCss=~{}, customJs=~{})}">
<body><th:block th:fragment="content">
<div class="page-header"><div class="row"><div class="col"><h1><i class="bi bi-cart-check"></i> Sale Invoice</h1></div>
<div class="col-auto"><a th:href="@{/sales}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a></div></div></div>
<div class="card mb-3"><div class="card-header"><h5>Sale Information</h5></div><div class="card-body"><div class="row">
<div class="col-md-6 mb-3"><h6 class="text-muted">Sale Number</h6><p class="fw-bold" th:text="${sale.saleNumber}"></p></div>
<div class="col-md-6 mb-3"><h6 class="text-muted">Invoice Number</h6><p class="fw-bold" th:text="${sale.invoiceNumber}"></p></div>
<div class="col-md-6 mb-3"><h6 class="text-muted">Sale Date</h6><p th:text="${#temporals.format(sale.saleDate, 'dd-MMM-yyyy')}"></p></div>
<div class="col-md-6 mb-3"><h6 class="text-muted">Customer</h6><p><span th:text="${sale.customerName}"></span> (<span th:text="${sale.customerCode}"></span>)</p></div>
<div class="col-md-6 mb-3"><h6 class="text-muted">Warehouse</h6><p th:text="${sale.warehouseName}"></p></div>
<div class="col-md-6 mb-3"><h6 class="text-muted">Payment Status</h6><p><span th:if="${sale.paymentStatus?.name() == 'PAID'}" class="badge bg-success">Paid</span>
<span th:if="${sale.paymentStatus?.name() == 'PARTIAL'}" class="badge bg-warning">Partial</span>
<span th:if="${sale.paymentStatus?.name() == 'PENDING'}" class="badge bg-danger">Pending</span></p></div></div></div></div>
<div class="card mb-3"><div class="card-header"><h5>Sale Items</h5></div><div class="card-body p-0"><div class="table-responsive">
<table class="table mb-0"><thead class="table-light"><tr><th>Product</th><th>SKU</th><th>Unit</th><th class="text-end">Quantity</th>
<th class="text-end">Rate</th><th class="text-end">Discount</th><th class="text-end">Amount</th></tr></thead><tbody>
<tr th:each="item : ${sale.items}"><td th:text="${item.productName}"></td><td th:text="${item.productSku}"></td>
<td th:text="${item.productUnit}"></td><td class="text-end" th:text="${#numbers.formatDecimal(item.quantity, 1, 2)}"></td>
<td class="text-end" th:text="${#numbers.formatDecimal(item.rate, 1, 2)}"></td>
<td class="text-end" th:text="${#numbers.formatDecimal(item.discountAmount, 1, 2)}"></td>
<td class="text-end" th:text="${#numbers.formatDecimal(item.amount, 1, 2)}"></td></tr>
</tbody></table></div></div></div>
<div class="card mb-3"><div class="card-header"><h5>Payment Summary</h5></div><div class="card-body"><div class="row">
<div class="col-md-4 mb-3"><h6>Subtotal</h6><p th:text="${#numbers.formatDecimal(sale.subtotal, 1, 2)}"></p></div>
<div class="col-md-4 mb-3"><h6>Discount</h6><p th:text="${#numbers.formatDecimal(sale.discount, 1, 2)}"></p></div>
<div class="col-md-4 mb-3"><h6 class="text-success">Total Amount</h6><p class="fw-bold text-success" th:text="${#numbers.formatDecimal(sale.totalAmount, 1, 2)}"></p></div>
<div class="col-md-4 mb-3"><h6>Received Amount</h6><p th:text="${#numbers.formatDecimal(sale.receivedAmount, 1, 2)}"></p></div>
<div class="col-md-4 mb-3"><h6>Payment Method</h6><p th:text="${sale.paymentMethod} ?: 'N/A'"></p></div>
<div class="col-md-4 mb-3"><h6 class="text-danger">Outstanding</h6>
<p class="fw-bold text-danger" th:text="${#numbers.formatDecimal(sale.totalAmount - sale.receivedAmount, 1, 2)}"></p></div></div></div></div>
</th:block></body></html>
