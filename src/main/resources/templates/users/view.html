<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: main(content=~{::content}, customCss=~{}, customJs=~{})}">
<body>
    <th:block th:fragment="content">
        <!-- Page Header -->
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col">
                    <h1><i class="bi bi-person"></i> User Details</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/users}">Users</a></li>
                            <li class="breadcrumb-item active" aria-current="page">View</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-auto">
                    <a th:href="@{/users/{id}/edit(id=${user.id})}" class="btn btn-primary">
                        <i class="bi bi-pencil"></i> Edit User
                    </a>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- User Information Card -->
            <div class="col-12 col-lg-8">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-info-circle"></i> User Information</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-12 text-center mb-3">
                                <div class="avatar-large bg-primary text-white mx-auto">
                                    <span th:text="${#strings.substring(user.name, 0, 1)}" style="font-size: 3rem;">A</span>
                                </div>
                                <h3 class="mt-3 mb-1" th:text="${user.name}">Name</h3>
                                <p class="text-muted" th:text="${user.email}">email@example.com</p>
                                <div>
                                    <span class="badge"
                                          th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' :
                                                         (${user.role.name() == 'WAREHOUSE_MANAGER'} ? 'bg-primary' : 'bg-secondary')"
                                          th:text="${#strings.replace(user.role.name(), '_', ' ')}">
                                        Role
                                    </span>
                                    <span class="badge ms-2"
                                          th:classappend="${user.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${user.status.name()}">
                                        Status
                                    </span>
                                </div>
                            </div>

                            <div class="col-12"><hr></div>

                            <div class="col-md-6">
                                <label class="text-muted small">User ID</label>
                                <p class="fw-bold" th:text="${user.id}">#</p>
                            </div>

                            <div class="col-md-6">
                                <label class="text-muted small">Email</label>
                                <p class="fw-bold">
                                    <i class="bi bi-envelope"></i>
                                    <span th:text="${user.email}">email@example.com</span>
                                </p>
                            </div>

                            <div class="col-md-6">
                                <label class="text-muted small">Phone Number</label>
                                <p class="fw-bold">
                                    <i class="bi bi-telephone"></i>
                                    <span th:text="${user.phone ?: 'Not provided'}">-</span>
                                </p>
                            </div>

                            <div class="col-md-6">
                                <label class="text-muted small">Role</label>
                                <p class="fw-bold">
                                    <i class="bi bi-award"></i>
                                    <span th:text="${#strings.replace(user.role.name(), '_', ' ')}">Role</span>
                                </p>
                            </div>

                            <div class="col-md-6">
                                <label class="text-muted small">Status</label>
                                <p class="fw-bold">
                                    <i class="bi bi-toggle-on"></i>
                                    <span th:text="${user.status.name()}">Status</span>
                                </p>
                            </div>

                            <div class="col-md-6">
                                <label class="text-muted small">Created At</label>
                                <p class="fw-bold">
                                    <i class="bi bi-calendar"></i>
                                    <span th:text="${#temporals.format(user.createdAt, 'MMM dd, yyyy HH:mm')}">Date</span>
                                </p>
                            </div>

                            <div class="col-md-6">
                                <label class="text-muted small">Last Updated</label>
                                <p class="fw-bold">
                                    <i class="bi bi-calendar-check"></i>
                                    <span th:text="${#temporals.format(user.updatedAt, 'MMM dd, yyyy HH:mm')}">Date</span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions & Quick Links -->
            <div class="col-12 col-lg-4">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-lightning"></i> Actions</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <a th:href="@{/users/{id}/edit(id=${user.id})}" class="btn btn-outline-primary">
                                <i class="bi bi-pencil"></i> Edit User
                            </a>
                            <button type="button"
                                    class="btn btn-outline-danger"
                                    th:onclick="'deleteUser(' + ${user.id} + ')'">
                                <i class="bi bi-trash"></i> Delete User
                            </button>
                            <hr>
                            <a th:href="@{/users}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Back to Users
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Additional Info Card -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-info-circle"></i> Additional Info</h5>
                    </div>
                    <div class="card-body">
                        <p class="small text-muted mb-2">
                            <strong>Account Age:</strong>
                            <span th:text="${#temporals.daysBetween(user.createdAt, #temporals.createNow())}">0</span> days
                        </p>
                        <p class="small text-muted mb-0">
                            <strong>Password:</strong> Encrypted with BCrypt
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Form -->
        <form id="deleteForm" method="post" style="display: none;">
            <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
        </form>

        <style>
            .avatar-large {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
            }
        </style>

        <script>
            function deleteUser(userId) {
                if (confirmDelete('Are you sure you want to delete this user? This action cannot be undone.')) {
                    const form = document.getElementById('deleteForm');
                    form.action = '/users/' + userId + '/delete';
                    form.submit();
                }
            }
        </script>
    </th:block>
</body>
</html>
