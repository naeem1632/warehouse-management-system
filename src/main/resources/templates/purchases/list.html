<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: main(content=~{::content}, customCss=~{}, customJs=~{::customJs})}">
<body>
    <th:block th:fragment="content">
        <!-- Page Header -->
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col">
                    <h1><i class="bi bi-cart-plus"></i> Purchase Management</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Purchases</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-auto">
                    <a th:href="@{/purchases/create}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> New Purchase
                    </a>
                </div>
            </div>
        </div>

        <!-- Alert Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Filters -->
        <div class="card mb-3">
            <div class="card-body">
                <form th:action="@{/purchases}" method="get" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Warehouse</label>
                        <select name="warehouseId" class="form-select">
                            <option value="">All Warehouses</option>
                            <option th:each="warehouse : ${warehouses}"
                                    th:value="${warehouse.id}"
                                    th:text="${warehouse.name}"
                                    th:selected="${warehouseId == warehouse.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Supplier</label>
                        <select name="supplierId" class="form-select">
                            <option value="">All Suppliers</option>
                            <option th:each="supplier : ${suppliers}"
                                    th:value="${supplier.id}"
                                    th:text="${supplier.name}"
                                    th:selected="${supplierId == supplier.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">&nbsp;</label>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-funnel"></i> Filter
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Purchases Table -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">All Purchases (<span th:text="${totalItems}">0</span>)</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Purchase #</th>
                                <th>Date</th>
                                <th>Supplier</th>
                                <th>Warehouse</th>
                                <th>Total Amount</th>
                                <th>Paid</th>
                                <th>Payment Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(purchases)}">
                                <td colspan="8" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                                    <p class="mb-0 mt-2">No purchases found</p>
                                </td>
                            </tr>
                            <tr th:each="purchase : ${purchases}">
                                <td><strong th:text="${purchase.purchaseNumber}"></strong></td>
                                <td th:text="${#temporals.format(purchase.purchaseDate, 'dd-MMM-yyyy')}"></td>
                                <td>
                                    <div th:text="${purchase.supplierName}"></div>
                                    <small class="text-muted" th:text="${purchase.supplierCode}"></small>
                                </td>
                                <td th:text="${purchase.warehouseName}"></td>
                                <td th:text="${#numbers.formatDecimal(purchase.totalAmount, 1, 2)}"></td>
                                <td th:text="${#numbers.formatDecimal(purchase.paidAmount, 1, 2)}"></td>
                                <td>
                                    <span th:if="${purchase.paymentStatus?.name() == 'PAID'}" class="badge bg-success">Paid</span>
                                    <span th:if="${purchase.paymentStatus?.name() == 'PARTIAL'}" class="badge bg-warning">Partial</span>
                                    <span th:if="${purchase.paymentStatus?.name() == 'PENDING'}" class="badge bg-danger">Pending</span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/purchases/{id}(id=${purchase.id})}" class="btn btn-outline-info" title="View">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/purchases/{id}/edit(id=${purchase.id})}"
                                           class="btn btn-outline-warning" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/purchases/{id}/delete(id=${purchase.id})}" method="post" style="display:inline;">
                                            <button type="submit" class="btn btn-outline-danger btn-sm" title="Delete"
                                                    onclick="return confirm('Are you sure you want to delete this purchase?\n\nThis will also delete:\n- All purchase items\n- Payment records\n- Attachments\n- Audit history\n- Related stock movements\n\nThis action cannot be undone!')">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <div class="card-footer" th:if="${totalPages > 1}">
                <nav>
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/purchases(page=${currentPage - 1}, warehouseId=${warehouseId}, supplierId=${supplierId})}">Previous</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/purchases(page=${i}, warehouseId=${warehouseId}, supplierId=${supplierId})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/purchases(page=${currentPage + 1}, warehouseId=${warehouseId}, supplierId=${supplierId})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </th:block>

    <th:block th:fragment="customJs">
        <script>
        </script>
    </th:block>
</body>
</html>
